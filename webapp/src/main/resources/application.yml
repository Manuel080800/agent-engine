server:
  error:
    include-message: never
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:true}
        same-site: lax
        path: /
      timeout: 30m
spring:
  jta:
    enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
  session:
    jdbc:
      initialize-schema: never
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
engine:
  issuer: ${ENGINE_ISSUER}
  bootstrap-token: ${BOOTSTRAP_TOKEN:}
  signing-key: ${SIGNING_KEY_PATH}
  local-client-redirect: ${LOCAL_CLIENT_REDIRECT:http://127.0.0.1:8765/callback}
  authorization-server: false
  route-prefix: /web/v1

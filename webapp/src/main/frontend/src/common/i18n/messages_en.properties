description.projects=Organize work by project and define the context the agent will use.
description.profiles=Store profiles describing how the agent should work and mark them active or inactive. They can be consulted as reusable configuration.
description.rules=Define instructions and constraints the agent must follow during its work.
description.skills=A skill is a reusable instruction for a specific activity, such as reviewing code. Store instructions here for the agent to consult and incorporate into its work.
description.models=Configure available models, effort levels, priority and whether they require authorization before use. The catalog is dynamic.
description.model-policies=Assign a model and effort level to each agent role.
description.memories=Keep useful information from previous work for the agent to use as context.
description.tasks=Manage each execution through a task. Open its detail to view the plan, work blocks and checkpoints, and provide authorizations.
description.plans=The plan defines a task’s scope and acceptance criteria.
description.blocks=Blocks divide the plan into verifiable pieces of work.
description.checkpoints=Checkpoints save a task’s state and next action so it can be resumed.
description.reviews=View review findings and their resolution status.
description.memory-proposals=Review, edit and approve or reject information the agent proposes to add to memory.
description.local-clients=Local clients connect the plugin on your computer to the server to synchronize tasks. Deactivation revokes access and retains the record; permanent deletion requires no related records.

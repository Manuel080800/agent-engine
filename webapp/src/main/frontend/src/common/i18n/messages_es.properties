help.invitation=Permite registrar a otro usuario con un token temporal.
description.projects=Organiza el trabajo por proyecto y define el contexto que utilizará el agente.
description.profiles=Guarda perfiles que describen la forma de trabajar del agente y permite identificarlos como activos o inactivos. Se pueden consultar como configuración reutilizable.
description.rules=Define las instrucciones y restricciones que el agente debe respetar durante el trabajo.
description.skills=Una skill es una instrucción reutilizable para realizar una actividad específica, por ejemplo revisar código. Aquí guardas las instrucciones que el agente puede consultar e incorporar al trabajo.
description.models=Configura los modelos disponibles, sus niveles de esfuerzo, prioridad y si requieren autorización antes de usarlos. El catálogo es dinámico.
description.model-policies=Asigna un modelo y un nivel de esfuerzo a cada rol del agente.
description.memories=Conserva información útil de trabajos anteriores para que el agente pueda utilizarla como contexto.
description.tasks=Gestiona cada ejecución desde una tarea. Abre su detalle para consultar el plan, los bloques de trabajo y los checkpoints, y autorizar lo que corresponda.
description.plans=El plan define el alcance y los criterios de aceptación de una tarea.
description.blocks=Los bloques dividen el plan en partes de trabajo verificables.
description.checkpoints=Los checkpoints guardan el estado y la siguiente acción de la tarea para poder retomarla.
description.reviews=Consulta los hallazgos de las revisiones y su estado de resolución.
description.memory-proposals=Revisa, edita y aprueba o rechaza la información que el agente propone incorporar a la memoria.
description.local-clients=Los clientes locales conectan el plugin de tu equipo con el servidor para sincronizar tareas. Dar de baja revoca el acceso y conserva el registro; eliminar definitivamente requiere que no tenga relaciones.
error.backend.Client\ must\ be\ inactive\ before\ deletion=Primero da de baja el cliente para revocar su acceso.
error.backend.Client\ has\ related\ records=El cliente tiene registros relacionados. Puedes darlo de baja para conservar su historial, pero no eliminarlo definitivamente.
task.noCheckpoints=Esta tarea todavía no tiene checkpoints.
